    description: "کمپوزر میں ایک ٹوگل بٹن شامل کرتا ہے جو اردو کے اضافی حروف (حمزہ حروف، نقاط، اعزازی، آیات کے نشان) کی ایک قطار کو دکھاتا/چھپاتا ہے جو بصورت دیگر معیاری کی بورڈ سے قابل رسائی نہیں۔ کسی کردار کو کرسر پر داخل کرنے کے لیے اسے تھپتھپائیں۔"
    name: "اضافی اردو بار"
    author: "فرحان غنی"
